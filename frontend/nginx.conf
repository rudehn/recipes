server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Recipe photo uploads go through this proxy; backend enforces 10 MB.
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # nginx's mime.types has no entry for .webmanifest; scope the correct
    # type here (a server-level `types` block would replace the whole table).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    #
    # The launch page, which must never be cached without asking.
    #
    # It is the one file naming the hashed bundles, so a stale copy of it pins
    # the whole app to an old build - and because those bundles are immutable,
    # the old build then goes on working perfectly and indefinitely. There is
    # nothing to notice: no error, no missing file, just a version from before.
    #
    # Without a Cache-Control header a cache is free to invent freshness for
    # itself, and the usual heuristic is a tenth of the file's age. That gets
    # worse the better the deploys are: the longer a build sits unchanged, the
    # longer the next visitor is entitled to keep it. An iOS home-screen app
    # caches separately from the browser, so it can sit on an old build while
    # Safari on the same phone shows the new one.
    #
    # no-cache rather than no-store: the copy may be kept, it just cannot be
    # used without asking. The ETag above makes that a 304 and no body
    # whenever nothing has changed, which is almost always.
    #
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for client-side routes. try_files' final argument is an
    # internal redirect, so a deep link re-enters the block above and is served
    # with the same header rather than the fallback's absence of one.
    location / {
        try_files $uri /index.html;
    }
}
