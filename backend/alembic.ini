# Alembic config. The database URL is not set here on purpose: env.py reads
# app.config.DATABASE_URL so migrations always target the same database the
# app itself opens, with no second place to keep in sync.
#
# Run from the backend/ directory:
#   uv run alembic revision --autogenerate -m "what changed"
#   uv run alembic upgrade head
#
# The app also runs `upgrade head` itself on startup (app/migrations.py), so
# deploys need no manual step.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Date-prefixed so the versions/ directory reads in chronological order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic,app

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

# app.migrations reports when it adopts a database that predates Alembic.
[logger_app]
level = INFO
handlers =
qualname = app

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
